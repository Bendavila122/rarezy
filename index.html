<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <title>Rarezy — Win it, don't wait for it</title>
    <meta
      name="description"
      content="Sell your luxury watch for an instant cash offer, or enter it into a skill-based competition."
    />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.15 0.008 260);
        transition: opacity 0.35s ease;
      }
      #splash img {
        width: 56px;
        height: 56px;
        animation: rz-pulse 1.1s ease-in-out infinite;
      }
      #splash.rz-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes rz-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.92);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash"><img src="/rarezy-icon.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
